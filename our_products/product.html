<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading... | Imautotech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={corePlugins:{preflight:false}}</script>
  <style>
    *{font-family:'DM Sans',sans-serif}
    h1,h2,h3,.font-display{font-family:'Playfair Display',serif}
    body{background:#08080c}
    @keyframes reveal{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleReveal{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
    @keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(10px,-15px)}50%{transform:translate(-5px,-8px)}75%{transform:translate(8px,5px)}}
    @keyframes breathe{0%,100%{opacity:.15}50%{opacity:.35}}
    .reveal{animation:reveal .8s cubic-bezier(.16,1,.3,1) both}
    .reveal-d1{animation:reveal .8s cubic-bezier(.16,1,.3,1) .1s both}
    .reveal-d2{animation:reveal .8s cubic-bezier(.16,1,.3,1) .2s both}
    .reveal-d3{animation:reveal .8s cubic-bezier(.16,1,.3,1) .3s both}
    .reveal-d4{animation:reveal .8s cubic-bezier(.16,1,.3,1) .4s both}
    .scale-reveal{animation:scaleReveal .9s cubic-bezier(.16,1,.3,1) .25s both}
    .drift{animation:drift 20s ease-in-out infinite}
    .breathe{animation:breathe 6s ease-in-out infinite}
    .card{background:linear-gradient(145deg,rgba(255,255,255,.025) 0%,rgba(255,255,255,.005) 100%);border:1px solid rgba(255,255,255,.06);transition:all .4s cubic-bezier(.16,1,.3,1)}
    .card:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);transform:translateY(-3px)}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08) 50%,transparent)}
    .pill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:all .3s}
    .pill:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
    .btn-main{background:linear-gradient(135deg,#c7a376,#a3845a);color:#08080c;font-weight:600;transition:all .3s;box-shadow:0 4px 20px rgba(199,163,118,.15)}
    .btn-main:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 8px 30px rgba(199,163,118,.25)}
    .btn-ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);transition:all .3s}
    .btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
  </style>
</head>
<body class="text-white min-h-screen overflow-x-hidden">
  <div class="grain"></div>

  <!-- ═══ HERO ═══ -->
  <section id="hero" class="relative min-h-screen flex items-center">
    <!-- Ambient orbs -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div id="orb-1" class="absolute top-[10%] left-[15%] w-[500px] h-[500px] rounded-full blur-[180px] breathe drift" style="background:rgba(99,102,241,.12)"></div>
      <div id="orb-2" class="absolute bottom-[5%] right-[10%] w-[600px] h-[600px] rounded-full blur-[200px] breathe drift" style="background:rgba(168,85,247,.08);animation-delay:3s"></div>
    </div>
    <!-- Dot grid -->
    <div class="absolute inset-0 opacity-[0.025]" style="background-image:radial-gradient(rgba(255,255,255,.6) 1px,transparent 1px);background-size:48px 48px"></div>

    <div class="relative z-10 max-w-7xl mx-auto px-6 py-28 w-full">
      <!-- Nav -->
      <a href="../index.html" class="inline-flex items-center gap-2 text-white/25 hover:text-white/50 text-xs tracking-[.15em] uppercase mb-16 transition-colors reveal">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Products
      </a>

      <div class="flex flex-col lg:flex-row items-center gap-20">
        <!-- Text -->
        <div class="flex-1 text-center lg:text-left max-w-2xl">
          <div class="flex items-center gap-5 mb-10 justify-center lg:justify-start reveal">
            <img id="product-icon" src="" alt="" class="w-20 h-20 rounded-[1.25rem] shadow-2xl hidden ring-1 ring-white/10">
            <div id="icon-fallback" class="w-20 h-20 rounded-[1.25rem] shadow-2xl ring-1 ring-white/10 flex items-center justify-center text-3xl font-bold hidden"></div>
          </div>

          <h1 id="product-title" class="text-5xl md:text-6xl lg:text-[4.5rem] font-display font-bold mb-5 leading-[1.05] reveal-d1"></h1>
          <div id="product-platforms" class="flex flex-wrap gap-2 mb-7 justify-center lg:justify-start reveal-d2"></div>
          <p id="product-description" class="text-lg text-white/45 mb-10 leading-relaxed reveal-d2"></p>
          <div id="product-actions" class="flex flex-wrap gap-3 justify-center lg:justify-start reveal-d3"></div>

          <div id="stats-badge" class="hidden mt-8 reveal-d4">
            <span class="inline-flex items-center gap-2 px-4 py-2 rounded-full pill text-sm text-emerald-400">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
              <span id="stats-text"></span>
            </span>
          </div>
        </div>

        <!-- Feature graphic -->
        <div class="flex-shrink-0 w-full lg:w-[42%] scale-reveal">
          <div id="hero-image-wrap" class="hidden relative">
            <div id="hero-glow" class="absolute -inset-6 rounded-3xl blur-3xl opacity-30"></div>
            <img id="product-hero" src="" alt="" class="relative w-full rounded-2xl shadow-2xl ring-1 ring-white/8">
          </div>
          <div id="hero-fallback" class="hidden relative mx-auto max-w-xs">
            <div id="fallback-glow" class="absolute -inset-10 rounded-full blur-[80px] opacity-20"></div>
            <div class="relative card rounded-[2rem] p-14 flex flex-col items-center min-h-[380px] justify-center">
              <img id="fallback-icon" src="" alt="" class="w-36 h-36 rounded-[1.75rem] shadow-2xl mb-8">
              <div id="fallback-title" class="text-xl font-display font-bold text-center text-white/70"></div>
              <div id="fallback-type" class="text-xs text-white/30 mt-3 px-4 py-1.5 rounded-full pill tracking-wide"></div>
              <div class="absolute top-5 right-5 flex gap-1.5 opacity-40">
                <div class="w-2 h-2 rounded-full bg-rose-400"></div>
                <div class="w-2 h-2 rounded-full bg-amber-400"></div>
                <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ FEATURES ═══ -->
  <section id="features-section" class="py-24 hidden">
    <div class="max-w-6xl mx-auto px-6">
      <div class="text-center mb-16">
        <p class="text-xs tracking-[.25em] uppercase text-[#c7a376] mb-3">Capabilities</p>
        <h2 class="text-4xl font-display font-bold">Key Features</h2>
      </div>
      <div id="features-grid" class="grid md:grid-cols-2 lg:grid-cols-4 gap-5"></div>
    </div>
  </section>

  <div class="divider max-w-xl mx-auto"></div>

  <!-- ═══ TECH ═══ -->
  <section id="tech-section" class="py-20 hidden">
    <div class="max-w-6xl mx-auto px-6">
      <div class="text-center mb-12">
        <p class="text-xs tracking-[.25em] uppercase text-white/30 mb-3">Stack</p>
        <h2 class="text-3xl font-display font-bold">Built With</h2>
      </div>
      <div id="tech-grid" class="flex flex-wrap justify-center gap-3"></div>
    </div>
  </section>

  <!-- ═══ SERVER DOWNLOADS ═══ -->
  <section id="server-section" class="py-24 hidden" style="background:linear-gradient(180deg,transparent,rgba(255,255,255,.01) 50%,transparent)">
    <div class="max-w-5xl mx-auto px-6 text-center">
      <p class="text-xs tracking-[.25em] uppercase text-[#c7a376] mb-3">Get Started</p>
      <h2 class="text-3xl font-display font-bold mb-4">Desktop Downloads</h2>
      <p class="text-white/35 mb-14 max-w-md mx-auto">Install the server on your computer to connect your phone.</p>
      <div id="server-grid" class="grid md:grid-cols-3 gap-5"></div>
    </div>
  </section>

  <!-- ═══ GALLERY ═══ -->
  <section id="gallery-section" class="py-24 hidden">
    <div class="max-w-7xl mx-auto px-6">
      <div class="text-center mb-16">
        <p class="text-xs tracking-[.25em] uppercase text-white/30 mb-3">Preview</p>
        <h2 class="text-4xl font-display font-bold">Screenshots</h2>
      </div>
      <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>
  </section>

  <!-- ═══ CTA ═══ -->
  <section id="cta-section" class="py-24 hidden">
    <div class="max-w-2xl mx-auto px-6 text-center">
      <div class="card rounded-3xl p-14">
        <h2 id="cta-title" class="text-3xl font-display font-bold mb-4"></h2>
        <p class="text-white/35 mb-10">Available on your favorite platform.</p>
        <div id="cta-actions" class="flex flex-wrap gap-3 justify-center"></div>
      </div>
    </div>
  </section>

  <!-- ═══ FOOTER ═══ -->
  <footer class="py-12 text-center">
    <div class="divider max-w-xl mx-auto mb-8"></div>
    <div class="max-w-6xl mx-auto px-6">
      <div class="flex flex-wrap justify-center gap-8 text-xs tracking-[.1em] uppercase mb-6">
        <a href="../index.html" class="text-white/25 hover:text-white/50 transition-colors">Home</a>
        <a id="footer-support" href="../support/" class="text-white/25 hover:text-white/50 transition-colors">Support</a>
        <a id="footer-privacy" href="../support/privacy.html" class="text-white/25 hover:text-white/50 transition-colors">Privacy</a>
        <a id="footer-terms" href="../support/terms.html" class="text-white/25 hover:text-white/50 transition-colors">Terms</a>
      </div>
      <p class="text-white/15 text-xs">&copy; 2025 Imautotech</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/gallery.js"></script>
  <script>
  (async function() {
    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) { document.getElementById('product-title').textContent = 'Product not found'; return; }

    const { data: p, error } = await _supabase.from('products').select('*').eq('slug', slug).single();
    if (error || !p) { document.getElementById('product-title').textContent = 'Product not found'; return; }

    if (p.has_custom_page && p.custom_page_path) { window.location.href = '../' + p.custom_page_path; return; }

    document.title = p.title + ' | Imautotech';

    // Footer links
    document.getElementById('footer-support').href = `../support/?product=${slug}`;
    document.getElementById('footer-privacy').href = `../support/privacy.html?product=${slug}`;
    document.getElementById('footer-terms').href = `../support/terms.html?product=${slug}`;

    // Color mapping
    const gradientColors = {
      'from-blue-600':'#2563eb','to-cyan-500':'#06b6d4','from-emerald-600':'#059669','to-teal-500':'#14b8a6',
      'from-violet-600':'#7c3aed','to-indigo-500':'#6366f1','from-pink-600':'#db2777','to-rose-500':'#f43f5e',
      'from-amber-600':'#d97706','to-orange-500':'#f97316','from-green-600':'#16a34a','to-emerald-500':'#10b981',
      'from-orange-600':'#ea580c','to-red-500':'#ef4444','from-slate-600':'#475569','to-gray-500':'#6b7280',
      'from-teal-600':'#0d9488','to-green-500':'#22c55e','from-purple-600':'#9333ea','to-fuchsia-500':'#d946ef',
      'from-indigo-600':'#4f46e5','to-blue-500':'#3b82f6','from-sky-600':'#0284c7','from-cyan-600':'#0891b2',
    };
    const grad = p.gradient || '';
    const parts = grad.split(' ');
    const c1 = gradientColors[parts[0]] || '#6366f1';
    const c2 = gradientColors[parts[1]] || '#8b5cf6';

    document.getElementById('orb-1').style.background = `${c1}18`;
    document.getElementById('orb-2').style.background = `${c2}12`;

    // Title & description
    document.getElementById('product-title').textContent = p.title;
    document.getElementById('product-description').textContent = p.long_description || p.description || '';

    // Icon
    if (p.icon_url) {
      const icon = document.getElementById('product-icon');
      icon.src = p.icon_url; icon.alt = p.title; icon.classList.remove('hidden');
    } else {
      const fb = document.getElementById('icon-fallback');
      fb.textContent = p.title[0]; fb.style.background = `linear-gradient(135deg,${c1},${c2})`;
      fb.classList.remove('hidden');
    }

    // Hero or fallback
    if (p.hero_image_url) {
      document.getElementById('hero-image-wrap').classList.remove('hidden');
      document.getElementById('hero-glow').style.background = `linear-gradient(135deg,${c1}40,${c2}40)`;
      const hero = document.getElementById('product-hero');
      hero.src = p.hero_image_url; hero.alt = p.title;
    } else {
      document.getElementById('hero-fallback').classList.remove('hidden');
      document.getElementById('fallback-glow').style.background = `linear-gradient(135deg,${c1},${c2})`;
      if (p.icon_url) document.getElementById('fallback-icon').src = p.icon_url;
      document.getElementById('fallback-title').textContent = p.title;
      document.getElementById('fallback-type').textContent = (p.platforms || []).join(' / ') + (p.type ? ` \u2022 ${p.type}` : '');
    }

    // Platforms
    const platContainer = document.getElementById('product-platforms');
    (p.platforms || []).forEach(pl => {
      const badge = document.createElement('span');
      badge.className = 'px-3 py-1.5 text-xs rounded-full pill text-white/50 tracking-wide';
      badge.textContent = pl;
      platContainer.appendChild(badge);
    });

    // Actions
    const actions = document.getElementById('product-actions');
    const ctaActions = document.getElementById('cta-actions');
    let hasAction = false;
    if (p.play_store_url) {
      const btn = `<a href="${p.play_store_url}" target="_blank" class="btn-main px-7 py-3.5 rounded-full text-sm inline-flex items-center gap-2"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3 20.5v-17c0-.83.94-1.3 1.6-.8l12.8 8.5a1 1 0 010 1.6l-12.8 8.5c-.66.5-1.6.03-1.6-.8z"/></svg>Google Play</a>`;
      actions.innerHTML += btn; ctaActions.innerHTML += btn; hasAction = true;
    }
    if (p.app_store_url) {
      const btn = `<a href="${p.app_store_url}" target="_blank" class="btn-ghost px-7 py-3.5 rounded-full text-sm inline-flex items-center gap-2">App Store</a>`;
      actions.innerHTML += btn; ctaActions.innerHTML += btn; hasAction = true;
    }
    if (p.apk_download_url) {
      const btn = `<a href="${p.apk_download_url}" class="btn-ghost px-7 py-3.5 rounded-full text-sm inline-flex items-center gap-2" download><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>APK</a>`;
      actions.innerHTML += btn; ctaActions.innerHTML += btn; hasAction = true;
    }

    if (p.stats) {
      document.getElementById('stats-badge').classList.remove('hidden');
      document.getElementById('stats-text').textContent = p.stats;
    }

    if (hasAction) {
      document.getElementById('cta-section').classList.remove('hidden');
      document.getElementById('cta-title').textContent = `Get ${p.title}`;
    }

    // Features
    const features = p.features || [];
    if (features.length > 0) {
      document.getElementById('features-section').classList.remove('hidden');
      const icons = ['M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z','M13 10V3L4 14h7v7l9-11h-7z','M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4','M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z','M15 12a3 3 0 11-6 0 3 3 0 016 0z','M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z'];
      document.getElementById('features-grid').innerHTML = features.map((f, i) => `
        <div class="card rounded-2xl p-7 group">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center mb-5" style="background:linear-gradient(135deg,${c1}20,${c2}20);border:1px solid ${c1}15">
            <svg class="w-5 h-5" style="color:${c1}" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${icons[i % icons.length]}"/></svg>
          </div>
          <h3 class="font-semibold text-[15px]">${f}</h3>
        </div>
      `).join('');
    }

    // Tech
    const tech = p.tech || [];
    if (tech.length > 0) {
      document.getElementById('tech-section').classList.remove('hidden');
      document.getElementById('tech-grid').innerHTML = tech.map(t =>
        `<span class="px-5 py-2.5 pill rounded-full text-sm text-white/50">${t}</span>`
      ).join('');
    }

    // Server Downloads
    const downloads = p.server_downloads || [];
    if (downloads.length > 0) {
      document.getElementById('server-section').classList.remove('hidden');
      const platformSvg = {
        Windows:'<path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/>',
        macOS:'<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>',
        Linux:'<path d="M12.504 0c-.155 0-.315.008-.48.021-4.226.333-3.105 4.807-3.17 6.298-.076 1.092-.3 1.953-1.05 3.02-.885 1.051-2.127 2.75-2.716 4.521-.278.832-.41 1.684-.287 2.489-.26.268-.45.6-.663.839-.199.199-.485.267-.797.4-.313.136-.658.269-.864.68-.09.189-.136.394-.132.602 0 .199.027.4.055.536.058.399.116.728.04.97-.249.68-.28 1.145-.106 1.484.174.334.535.47.94.601.81.2 1.91.135 2.774.6.926.466 1.866.67 2.616.47.526-.116.97-.464 1.208-.946.587-.003 1.23-.269 2.26-.334.699-.058 1.574.267 2.577.2.025.134.063.198.114.333.391.778 1.113 1.368 1.884 1.43.868.07 1.726-.28 2.373-.936.921-.93.915-2.037.715-2.802-.157-.6-.386-1.124-.598-1.554-.21-.429-.35-.865-.267-1.187.134-.533.666-.869 1.02-1.468.354-.601.456-1.266.157-2.134"/>',
      };
      document.getElementById('server-grid').innerHTML = downloads.map(d => `
        <div class="card rounded-2xl p-8 flex flex-col items-center">
          <svg class="w-12 h-12 mb-5 text-white/30" fill="currentColor" viewBox="0 0 24 24">${platformSvg[d.platform] || ''}</svg>
          <h3 class="text-lg font-semibold mb-1">${d.platform}</h3>
          <p class="text-white/30 text-sm mb-6">${d.label || ''}</p>
          <a href="${d.url}" class="btn-main px-6 py-3 rounded-full text-sm w-full text-center" download>Download</a>
        </div>
      `).join('');
    }

    // Gallery
    const { data: screenshots } = await _supabase
      .from('product_screenshots').select('id').eq('product_id', p.id).limit(1);
    if (screenshots && screenshots.length > 0) {
      document.getElementById('gallery-section').classList.remove('hidden');
      await loadGallery(slug);
    }
  })();
  </script>
</body>
</html>
